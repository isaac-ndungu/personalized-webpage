<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Webpage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/ac82667efe.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <form class="userForm flex flex-col items-center text-sm text-slate-800">
            <h1 class="text-4xl font-bold py-4 text-center">Please enter your details below</h1>
            <div class="max-w-96 w-full px-4">
                <label for="name" class="font-medium">Full Name</label>
                <div
                    class="flex items-center mt-2 mb-4 h-10 pl-3 border border-slate-300 rounded-full focus-within:ring-2 focus-within:ring-indigo-400 transition-all overflow-hidden">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M18.311 16.406a9.64 9.64 0 0 0-4.748-4.158 5.938 5.938 0 1 0-7.125 0 9.64 9.64 0 0 0-4.749 4.158.937.937 0 1 0 1.623.938c1.416-2.447 3.916-3.906 6.688-3.906 2.773 0 5.273 1.46 6.689 3.906a.938.938 0 0 0 1.622-.938M5.938 7.5a4.063 4.063 0 1 1 8.125 0 4.063 4.063 0 0 1-8.125 0"
                            fill="#475569" />
                    </svg>
                    <input type="text" class="nameInput h-full px-2 w-full outline-none bg-transparent"
                        placeholder="Enter your full name" required>
                </div>
                <label for="email-address" class="font-medium mt-4">Age</label>
                <div
                    class="flex items-center mt-2 mb-4 h-10 pl-3 border border-slate-300 rounded-full focus-within:ring-2 focus-within:ring-indigo-400 transition-all overflow-hidden">
                    <i class="fa-regular fa-calendar"></i>
                    <input type="number" class="ageInput h-full px-2 w-full outline-none bg-transparent"
                        placeholder="Enter your age" required>
                </div>
                <button type="submit"
                    class="button flex items-center justify-center gap-1 mt-5 bg-indigo-500 hover:bg-indigo-600 text-white py-2.5 w-full rounded-full transition">
                    Submit
                    <svg class="mt-0.5" width="21" height="20" viewBox="0 0 21 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="m18.038 10.663-5.625 5.625a.94.94 0 0 1-1.328-1.328l4.024-4.023H3.625a.938.938 0 0 1 0-1.875h11.484l-4.022-4.025a.94.94 0 0 1 1.328-1.328l5.625 5.625a.935.935 0 0 1-.002 1.33"
                            fill="#fff" />
                    </svg>
                </button>
            </div>
        </form>

        <div class="messageContainer"></div>
        
        <div class="userList text-center width-[300px]">
            
        </div>

        

    </main>


    <script src="script.js"></script>
</body>

</html>
