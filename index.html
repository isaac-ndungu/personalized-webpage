<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Webpage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/ac82667efe.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-300/60">
    <main>
        <form class="userForm flex flex-col items-center text-sm text-slate-800 max-w-xl mx-auto mt-32 py-8 border-slate-300 border-1 rounded-xl shadow-2xl bg-gray-300/60 hover:scale-[101%] font-sans">
            <h1 class="text-4xl font-bold py-4 text-center">Please Enter Your Details Below</h1>
            <div class="max-w-96 w-full px-4">
                <label for="name" class="font-semibold text-lg">Full Name</label>
                <div
                    class="flex items-center mt-2 mb-4 h-12 pl-3 border border-slate-600 rounded-full focus-within:ring-2 focus-within:ring-indigo-400 transition-all overflow-hidden">
                    <i class="fa-regular fa-user fa-lg"></i>
                    <input type="text" class="nameInput h-full px-2 w-full outline-none bg-transparent"
                        placeholder="Enter your full name" required>
                </div>
                <label for="email-address" class="font-semibold mt-4 text-lg">Age</label>
                <div
                    class="flex items-center mt-2 mb-4 h-12 pl-3 border border-slate-600 rounded-full focus-within:ring-2 focus-within:ring-indigo-400 transition-all overflow-hidden">
                    <i class="fa-regular fa-calendar fa-lg"></i>
                    <input type="number" class="ageInput h-full px-2 w-full outline-none bg-transparent"
                        placeholder="Enter your age" required>
                </div>
                <button type="submit"
                    class="button flex items-center justify-center gap-1 mt-5 bg-indigo-500 hover:bg-indigo-600 text-white py-2.5 w-full rounded-full transition">
                    Submit
                    <svg class="mt-0.5" width="21" height="20" viewBox="0 0 21 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="m18.038 10.663-5.625 5.625a.94.94 0 0 1-1.328-1.328l4.024-4.023H3.625a.938.938 0 0 1 0-1.875h11.484l-4.022-4.025a.94.94 0 0 1 1.328-1.328l5.625 5.625a.935.935 0 0 1-.002 1.33"
                            fill="#fff" />
                    </svg>
                </button>
            </div>
        </form>

        <div class="messageContainer"></div>
        
        <h3 class="text-2xl font-bold py-4 text-center mt-10">Saved Users</h3>
        <div class="userList text-center width-[300px]">
            
        </div>

        

    </main>


    <script src="script.js"></script>
</body>

</html>
